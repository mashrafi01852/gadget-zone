<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gadget Zone: Essential electronics, no account needed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #10203a; --paper: #f3f6fa; --card: #fff; --line: #d5dce6; --muted: #54627a;
    --signal: #ffd02e; --blue: #2447d6; --hover: #2447d6; --onhover: #fff; --thumb: #e4eaf3; --thumbtx: #6f7e98;
    --btn: #10203a; --onbtn: #fff; --band: #10203a; --bandtx: #c5cfe0; --note: #fff6e0;
    --display: "Bricolage Grotesque", "Arial Black", system-ui, sans-serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --ink: #e8edf7; --paper: #0d1526; --card: #16213a; --line: #2b3a58; --muted: #9fb0cc; --blue: #7f98ff; --hover: #7f98ff; --onhover: #0d1526; --thumb: #1f2c4a; --thumbtx: #8b9cc0; --btn: #e8edf7; --onbtn: #10203a; --band: #080f1e; --note: #2a2410; }
  }
  :root[data-theme="dark"] { --ink: #e8edf7; --paper: #0d1526; --card: #16213a; --line: #2b3a58; --muted: #9fb0cc; --blue: #7f98ff; --hover: #7f98ff; --onhover: #0d1526; --thumb: #1f2c4a; --thumbtx: #8b9cc0; --btn: #e8edf7; --onbtn: #10203a; --band: #080f1e; --note: #2a2410; }
  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 1rem/1.6 var(--body); }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--blue); outline-offset: 3px; }
  .wrap { width: min(1120px, 100% - 2.5rem); margin-inline: auto; }

  header.top { padding: 1.25rem 0; }
  .brand { font: 800 1.4rem/1 var(--display); text-decoration: none; letter-spacing: -.02em; }
  .brand i { font-style: normal; background: var(--signal); color: #10203a; padding: .1em .3em; border-radius: .25em; margin-left: .15em; }

  .hero { padding: clamp(2.5rem, 8vw, 6rem) 0 clamp(2rem, 5vw, 3.5rem); }
  .hero h1 { font: 800 clamp(2.5rem, 8vw, 5.5rem)/.98 var(--display); letter-spacing: -.035em; margin: 0 0 1.25rem; max-width: 14ch; }
  .hero p { font-size: clamp(1.05rem, 2.2vw, 1.3rem); color: var(--muted); max-width: 52ch; margin: 0 0 2rem; }
  .perks { display: flex; flex-wrap: wrap; gap: .5rem 1.5rem; margin: 2rem 0 0; padding: 0; list-style: none; font-weight: 600; font-size: .95rem; }
  .perks li::before { content: "✓"; color: var(--blue); margin-right: .45rem; }

  .btn { display: inline-block; font: 600 1rem/1 var(--body); text-decoration: none; padding: .95rem 1.4rem; border-radius: .6rem; border: 2px solid var(--btn); background: var(--btn); color: var(--onbtn); text-align: center; cursor: pointer; transition: transform .12s, background .12s; }
  .btn:hover { transform: translateY(-2px); background: var(--hover); border-color: var(--hover); color: var(--onhover); }
  .btn.signal { background: var(--signal); border-color: var(--signal); color: #10203a; }
  .btn.signal:hover { background: var(--hover); border-color: var(--hover); color: var(--onhover); }

  .shop { padding: 1.5rem 0 4rem; }
  .shop h2 { font: 800 clamp(1.6rem, 4vw, 2.2rem)/1.1 var(--display); letter-spacing: -.02em; margin: 0 0 1.5rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.25rem; }
  .product { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 1rem; overflow: hidden; display: flex; flex-direction: column; }
  .thumb { aspect-ratio: 4 / 3; display: grid; place-items: center; background: var(--thumb); color: var(--thumbtx); font: 600 .95rem var(--body); position: relative; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .info { padding: 1.1rem 1.1rem 1.25rem; display: flex; flex-direction: column; gap: .4rem; flex: 1; }
  .info h3 { font: 800 1.15rem/1.25 var(--display); margin: 0; }
  .info p { margin: 0; color: var(--muted); font-size: .95rem; flex: 1; }
  .price { font: 800 1.4rem/1 var(--display); margin: .6rem 0 .8rem; display: flex; align-items: baseline; flex-wrap: wrap; gap: .1rem .6rem; }
  .price span:empty { display: none; }
  .price-offer { order: 1; }
  .price-regular { order: 2; }
  .price:has(.price-offer:not(:empty)) .price-regular { font: 400 1rem var(--body); color: var(--muted); text-decoration: line-through; }

  .promise { background: var(--band); color: #fff; padding: 3rem 0; }
  .promise .wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.5rem 2.5rem; }
  .promise h3 { font: 800 1.2rem/1.2 var(--display); margin: 0 0 .35rem; color: var(--signal); }
  .promise p { margin: 0; color: var(--bandtx); }
  .banner { padding: 3.5rem 0; }
  .banner .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1.5rem; }
  .banner h2 { font: 800 clamp(1.6rem, 4vw, 2.4rem)/1.1 var(--display); letter-spacing: -.02em; margin: 0 0 .4rem; }
  .banner p { margin: 0; color: var(--muted); }
  footer { padding: 0 0 2rem; color: var(--muted); font-size: .9rem; }
  .admin-link { margin-left: 1rem; font-size: .8rem; opacity: .55; }

  /* ---- Owner login and edit mode ---- */
  dialog.login { border: 0; border-radius: 1rem; padding: 1.5rem; width: min(92vw, 360px); background: var(--card); color: var(--ink); box-shadow: 0 20px 60px rgba(16,32,58,.35); }
  dialog.login::backdrop { background: rgba(16,32,58,.6); }
  dialog.login h2 { font: 800 1.4rem/1.2 var(--display); margin: 0 0 1rem; }
  dialog.login label { display: block; font-weight: 600; font-size: .9rem; margin-bottom: .8rem; }
  dialog.login input { display: block; width: 100%; margin-top: .3rem; padding: .7rem .8rem; border: 2px solid var(--line); border-radius: .5rem; font: inherit; background: var(--paper); color: var(--ink); }
  .login-err { color: #d4380d; min-height: 1.3em; font-size: .9rem; margin: 0 0 .6rem; }
  .login-row { display: flex; gap: .6rem; }
  .login-row button, .bar button { font: 600 .95rem var(--body); padding: .7rem 1rem; border-radius: .5rem; border: 2px solid var(--btn); background: var(--btn); color: var(--onbtn); cursor: pointer; }
  .login-row button.ghost { background: transparent; color: var(--ink); }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: #10203a; color: #fff; border-top: 1px solid #2b3a58; padding: .75rem 1rem calc(.75rem + env(safe-area-inset-bottom, 0px)); display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; justify-content: center; }
  .bar span { font-weight: 600; font-size: .9rem; flex-basis: 100%; text-align: center; }
  .bar button { background: transparent; color: #fff; border-color: #fff; }
  .bar button.go { background: var(--signal); color: #10203a; border-color: var(--signal); }
  body.editing { padding-bottom: 7rem; }
  body.editing [contenteditable="true"] { outline: 2px dashed var(--blue); outline-offset: 3px; cursor: text; }
  body.editing a.btn { outline: 2px dashed #d4380d; outline-offset: 3px; }
  body.editing .price span:empty { display: inline-block; min-width: 7ch; }
  body.editing .price-offer:empty::before { content: "Offer price"; color: var(--thumbtx); font: 400 .8rem var(--body); }
  body.editing .price-regular:empty::before { content: "Regular price"; color: var(--thumbtx); font: 400 .8rem var(--body); }
  .linkbox { margin: .5rem 0 0; font: 600 .75rem var(--body); color: var(--ink); text-align: left; }
  .linkbox input { display: block; width: 100%; max-width: 380px; margin-top: .2rem; padding: .45rem .6rem; border: 2px dashed #d4380d; border-radius: .4rem; background: var(--note); font: 400 .85rem var(--body); color: var(--ink); }
  .pctl { position: absolute; top: .5rem; right: .5rem; display: flex; gap: .4rem; z-index: 2; }
  .pctl button, .pctl label { font: 600 .75rem var(--body); padding: .4rem .6rem; border-radius: .4rem; border: 0; background: #10203a; color: #fff; cursor: pointer; }
  .pctl .del { background: #b3261e; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div id="app"></div>
<noscript><p style="padding:2rem">This page needs JavaScript turned on to show products.</p></noscript>

<dialog class="login" id="loginDialog">
  <form id="loginForm" autocomplete="off">
    <h2>Owner login</h2>
    <label>Username<input id="lUser" type="text" required autocapitalize="none"></label>
    <label>Password<input id="lPass" type="password" required></label>
    <p class="login-err" id="lErr" role="alert"></p>
    <div class="login-row">
      <button type="submit">Log in</button>
      <button type="button" class="ghost" id="lCancel">Cancel</button>
    </div>
  </form>
</dialog>

<script>
(function () {
  /* Login codes (scrambled, not plain text). This only opens the edit tools.
     Real protection: only the page owner can publish changes live. */
  var USER_HASH = "53pyx57a4v", PASS_HASH = "25e1bnvc0rf";
  function hash(s) {
    var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (var i = 0, c; i < s.length; i++) { c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
  }
  window.adminHash = hash;

  var S = JSON.parse(document.getElementById("state").textContent);
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), body = document.body, editing = false, unsaved = false, artifactNs = null, assetsNs = null;
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var get = function (p) { return p.split(".").reduce(function (o, k) { return o[k]; }, S); };
  function set(p, v) { var k = p.split("."), last = k.pop(); k.reduce(function (o, x) { return o[x]; }, S)[last] = v; }
  var dbDoc = null, saveTimer = 0, saving = false, again = false;
  function writeDraft() { try { localStorage.setItem("gz_draft", JSON.stringify(S)); } catch (x) {} }
  var mark = function () { unsaved = true; S.rev = Date.now(); queueSave(); };
  function queueSave() { clearTimeout(saveTimer); say("Saving…"); saveTimer = setTimeout(flushSave, 1200); }
  function flushSave() {
    clearTimeout(saveTimer); writeDraft();
    if (!dbDoc) { say("Saved on this device. Click Publish live to update every visitor."); return; }
    if (saving) { again = true; return; }
    saving = true;
    dbDoc.set({ state: JSON.stringify(S), rev: S.rev }).then(function () {
      saving = false; unsaved = false;
      say("Saved ✓ Live for signed-in viewers. Publish live updates everyone else.");
      if (again) { again = false; flushSave(); }
    }, function (err) {
      saving = false; var k = err && err.code;
      say(k === "invalid_argument" || k === "revoked" ? "Only the page owner or an editor can save live. Draft kept on this device." :
          k === "quota_exceeded" ? "Too much data. Use smaller images." : "Could not save live. Draft kept on this device.");
    });
  }
  function listen(db) {
    dbDoc = db.doc("site/content");
    dbDoc.onSnapshot(function (snap) {
      if (!snap.exists || snap.metadata.hasPendingWrites) return;
      var d = snap.data(), N;
      try { N = JSON.parse(d && d.state); } catch (x) { return; }
      if (!N || !N.products || !(N.rev > S.rev) || editing) return;
      S = N; render();
    }, function () {});
  }

  function F(p) { return ' data-f="' + p + '"' + (editing ? ' contenteditable="true"' : ""); }
  function T(tag, p, cls) { return "<" + tag + (cls ? ' class="' + cls + '"' : "") + F(p) + ">" + esc(get(p)) + "</" + tag + ">"; }
  function btn(p, cls) {
    var b = get(p);
    return '<a class="btn' + (cls ? " " + cls : "") + '" href="#" data-link="' + esc(b.link) + '" data-b="' + p + '">' + esc(b.text) + "</a>" +
      (editing ? '<div class="linkbox"><label>Hidden link (only you see this)<input type="text" data-l="' + p + '" value="' + esc(b.link) + '" placeholder="https://your-checkout-link" autocapitalize="none"></label></div>' : "");
  }
  function prod(p, i) {
    var P = "products." + i;
    return '<article class="product">' +
      (editing ? '<div class="pctl"><label>Upload image<input type="file" accept="image/*" hidden data-i="' + i + '"></label><button type="button" data-act="url" data-i="' + i + '">Image URL</button><button type="button" class="del" data-act="del" data-i="' + i + '">Delete</button></div>' : "") +
      '<div class="thumb">' + (p.image ? '<img src="' + esc(p.image) + '" alt="' + esc(p.name) + '" loading="lazy">' : "Product image") + "</div>" +
      '<div class="info">' + T("h3", P + ".name") + T("p", P + ".desc") +
      '<div class="price"><span class="price-offer"' + F(P + ".offer") + ">" + esc(p.offer) + '</span><span class="price-regular"' + F(P + ".regular") + ">" + esc(p.regular) + "</span></div>" +
      btn(P + ".btn") + "</div></article>";
  }
  function render() {
    var h = '<header class="top"><div class="wrap"><a class="brand" href="#"><span' + F("brand.name") + ">" + esc(S.brand.name) + "</span><i" + F("brand.accent") + ">" + esc(S.brand.accent) + "</i></a></div></header><main>";
    h += '<section class="hero"><div class="wrap">' + T("h1", "hero.headline") + T("p", "hero.sub") + btn("hero.cta", "signal") +
      '<ul class="perks">' + S.hero.perks.map(function (x, i) { return T("li", "hero.perks." + i); }).join("") + "</ul></div></section>";
    h += '<section class="shop" id="products"><div class="wrap">' + T("h2", "shopTitle") + '<div class="grid">' + S.products.map(prod).join("") + "</div></div></section>";
    h += '<section class="promise"><div class="wrap">' + S.promise.map(function (x, i) { return "<div>" + T("h3", "promise." + i + ".title") + T("p", "promise." + i + ".text") + "</div>"; }).join("") + "</div></section>";
    h += '<section class="banner"><div class="wrap"><div>' + T("h2", "banner.title") + T("p", "banner.text") + "</div><div>" + btn("banner.cta", "signal") + "</div></div></section></main>";
    h += "<footer><div class=\"wrap\"><span" + F("footer") + ">" + esc(S.footer) + '</span><a class="admin-link" href="#" id="adminLink">Admin</a></div></footer>';
    app.innerHTML = h;
  }
  render();

  document.addEventListener("click", function (e) {
    var t = e.target, a = t.closest && t.closest("a");
    if (t.id === "adminLink") {
      e.preventDefault();
      if (!editing) { $("lErr").textContent = ""; $("lUser").value = ""; $("lPass").value = ""; $("loginDialog").showModal(); }
      return;
    }
    if (!editing) {
      var l = ((a && a.getAttribute("data-link")) || "").trim();
      if (!l || /^\s*javascript:/i.test(l)) return;
      e.preventDefault();
      if (l.charAt(0) === "#") { var el = document.getElementById(l.slice(1)); if (el) el.scrollIntoView({ behavior: "smooth" }); return; }
      window.location.href = l;
      return;
    }
    var ab = t.closest("[data-act]");
    if (ab) {
      var i = +ab.dataset.i;
      if (ab.dataset.act === "del") {
        if (confirm("Delete this product?")) { S.products.splice(i, 1); mark(); render(); }
      } else {
        var u = prompt("Paste the image URL:");
        if (u && u.trim()) { S.products[i].image = u.trim(); mark(); render(); }
      }
      return;
    }
    if (a) {
      e.preventDefault();
      if (a.dataset.b) {
        var b = get(a.dataset.b), nt = prompt("Button text:", b.text);
        if (nt !== null && nt.trim()) { b.text = nt.trim(); a.textContent = b.text; mark(); }
        var lb = a.nextElementSibling;
        if (lb) lb.querySelector("input").focus();
      }
    }
  }, true);

  document.addEventListener("input", function (e) {
    if (!editing) return;
    var t = e.target; mark();
    if (t.dataset.f) {
      var v = t.textContent.trim();
      set(t.dataset.f, v);
      if (!v && (t.classList.contains("price-offer") || t.classList.contains("price-regular"))) t.innerHTML = "";
    } else if (t.dataset.l) {
      var b = get(t.dataset.l); b.link = t.value.trim();
      var a = t.closest(".linkbox").previousElementSibling;
      if (a) a.setAttribute("data-link", b.link);
    }
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (!editing || t.type !== "file" || !t.files[0]) return;
    var i = +t.dataset.i, f = t.files[0];
    function done(u) { S.products[i].image = u; mark(); render(); }
    function local() { var img = new Image(), u = URL.createObjectURL(f); img.onload = function () { var k = Math.min(1, 720 / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); done(c.toDataURL("image/jpeg", 0.72)); }; img.onerror = function () { URL.revokeObjectURL(u); alert("Could not read that image."); }; img.src = u; }
    if (assetsNs) assetsNs.upload(f).then(function (r) { done(r.url); }, local); else local();
  });
  document.addEventListener("paste", function (e) {
    if (!editing || !e.target.closest("[contenteditable]")) return;
    e.preventDefault();
    document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text/plain"));
  });
  document.addEventListener("keydown", function (e) {
    if (editing && e.key === "Enter" && e.target.closest("[contenteditable]")) e.preventDefault();
  });
  window.addEventListener("beforeunload", function (e) { if (editing && unsaved) { e.preventDefault(); e.returnValue = ""; } });

  $("lCancel").addEventListener("click", function () { $("loginDialog").close(); });
  $("loginForm").addEventListener("submit", function (e) {
    e.preventDefault();
    if (hash($("lUser").value.trim()) === USER_HASH && hash($("lPass").value) === PASS_HASH) { $("loginDialog").close(); enter(); }
    else { $("lErr").textContent = "Wrong username or password."; $("lPass").value = ""; }
  });

  function say(m) { var s = $("bStat") || $("bMsg"); if (s) s.textContent = m; }
  function enter() {
    var dr = null; try { dr = JSON.parse(localStorage.getItem("gz_draft") || "null"); } catch (x) {}
    var restored = !!(dr && dr.products && dr.rev > S.rev);
    if (restored) { S = dr; unsaved = true; }
    editing = true; body.classList.add("editing"); render();
    if (restored) setTimeout(queueSave, 0);
    var b = document.createElement("div");
    b.className = "bar admin-only"; b.id = "adminBar";
    b.innerHTML = '<span id="bMsg">Admin mode: click any text to edit. Click a button to change its text, and type its hidden link in the box under it.' + (artifactNs ? " Edits save automatically. Click Publish live to push them to every visitor." : "") + "</span><span id=\"bStat\"></span>" +
      '<button type="button" id="bAdd">Add product</button>' +
      (artifactNs ? '<button type="button" class="go" id="bPub">Publish live</button>' : '<button type="button" class="go" id="bSave">Download updated page</button>') +
      '<button type="button" id="bExit">Exit admin</button>';
    body.appendChild(b);
    $("bAdd").onclick = function () {
      S.products.push({ name: "New product", desc: "Describe this product.", regular: "$0.00", offer: "", image: "", btn: { text: "Buy Now", link: "" } });
      mark(); render();
      var g = document.querySelectorAll(".product"); g[g.length - 1].scrollIntoView({ behavior: "smooth", block: "center" });
    };
    if ($("bPub")) $("bPub").onclick = publish;
    if ($("bSave")) $("bSave").onclick = download;
    $("bExit").onclick = function () {
      if (unsaved && !confirm("You have changes that are not saved. Exit anyway?")) return;
      editing = false; body.classList.remove("editing"); render(); b.remove();
    };
  }

  function buildHtml() {
    var c = document.documentElement.cloneNode(true);
    c.querySelector("#app").innerHTML = "";
    c.querySelector("#state").textContent = "\n" + JSON.stringify(S, null, 2).replace(/</g, "\\u003c") + "\n";
    c.querySelectorAll(".admin-only").forEach(function (n) { n.remove(); });
    c.querySelector("body").removeAttribute("class");
    c.querySelector("#loginDialog").removeAttribute("open");
    return "<!DOCTYPE html>\n" + c.outerHTML;
  }
  function publish() {
    say("Publishing…"); try { sessionStorage.setItem("gz_admin", "1"); } catch (x) {} flushSave();
    artifactNs.publish(buildHtml()).then(function () { unsaved = false; say("Published."); }, function (err) {
      var k = err && err.code;
      try { sessionStorage.removeItem("gz_admin"); } catch (x) {}
      say(k === "not_writer" || k === "not_granted" ? "Only the page owner can publish. Open the page from your own account." :
          k === "conflict" ? "Someone published first. The page is reloading." :
          k === "rate_limited" ? "Too many publishes in a row. Wait a minute and try again." : "Could not publish. Try again.");
    });
  }
  function download() {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([buildHtml()], { type: "text/html" }));
    a.download = "gadget-zone.html";
    body.appendChild(a); a.click(); a.remove();
    unsaved = false;
  }

  if (window.claude && window.claude.use) {
    window.claude.use("db").then(function (n) { if (n) listen(n); }, function () {});
    window.addEventListener("pagehide", function () { if (editing) writeDraft(); });
    window.claude.use("artifact").then(function (n) {
      artifactNs = n;
      var back = false; try { back = sessionStorage.getItem("gz_admin") === "1"; sessionStorage.removeItem("gz_admin"); } catch (x) {}
      if (back && n && !editing) enter();
    }, function () {});
    window.claude.use("assets").then(function (n) { assetsNs = n; }, function () {});
  }
})();
</script>

</body>
</html>
